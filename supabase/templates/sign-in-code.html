<!-- Sign-in email for Zarify merchants (local Supabase; set the same
     template in the hosted project's Auth > Email Templates). -->
<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 32px 16px;
      background: #f6f4f0;
      font-family: Arial, Helvetica, sans-serif;
      color: #1e1a16;
    "
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            style="
              max-width: 440px;
              background: #ffffff;
              border-radius: 12px;
              padding: 32px;
            "
          >
            <tr>
              <td>
                <p
                  style="
                    margin: 0 0 8px;
                    font-size: 13px;
                    letter-spacing: 2px;
                    text-transform: uppercase;
                    color: #7a6f63;
                  "
                >
                  Zarify
                </p>
                <h1 style="margin: 0 0 16px; font-size: 22px">
                  Your sign-in code
                </h1>
                <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.5">
                  Enter this code on the sign-in page. It expires in 10 minutes.
                </p>
                <p
                  style="
                    margin: 0 0 24px;
                    font-size: 32px;
                    font-weight: bold;
                    letter-spacing: 8px;
                  "
                >
                  {{ .Token }}
                </p>
                <p style="margin: 0 0 24px; font-size: 14px; line-height: 1.5">
                  Or
                  <a
                    href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email"
                    style="color: #7a1f2b"
                    >sign in with this link</a
                  >
                  on this device.
                </p>
                <p
                  style="
                    margin: 0;
                    font-size: 13px;
                    line-height: 1.5;
                    color: #7a6f63;
                  "
                >
                  If you didn't try to sign in to Zarify, you can ignore this
                  email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
